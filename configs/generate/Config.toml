# Mate configuration is declared here and compiled into generated.go.
# Run: go generate ./configs/...

[paths.MATE_STUDY_DIR]
go-type = "Path"
default = "~/GoodNotes"
description = "Local directory recursively scanned for GoodNotes PDF exports"
used-by = ["mate"]

[paths.MATE_OUTPUT_DIR]
go-type = "Path"
default = "~/.mate/output"
description = "Directory where Mate writes transcripts, study material, and review images"
used-by = ["mate"]

[state.MATE_STATE_DB]
go-type = "Path"
default = "~/.mate/state.db"
description = "SQLite database used to track observed and processed pages"
used-by = ["mate"]

[anki.MATE_ANKI_ENDPOINT]
go-type = "string"
default = "http://127.0.0.1:8765"
description = "AnkiConnect HTTP endpoint used to synchronize generated cards"
used-by = ["mate"]

[anki.MATE_ANKI_DECK]
go-type = "string"
default = "Mate"
description = "Root Anki deck; each source PDF is synchronized to a child deck"
used-by = ["mate"]

[llm.MATE_LLM_API_KEY]
go-type = "RedactedString"
default = ""
file = true
description = "API key for the OpenAI-compatible endpoint; required at startup"
used-by = ["mate"]

[llm.MATE_LLM_MODEL]
go-type = "string"
default = "gpt-5.1"
description = "Chat model identifier requested from the OpenAI-compatible endpoint"
used-by = ["mate"]

[llm.MATE_LLM_BASE_URL]
go-type = "string"
default = "https://api.openai.com/v1"
description = "OpenAI-compatible chat completion endpoint"
used-by = ["mate"]

[llm.MATE_LLM_TIMEOUT_SECONDS]
go-type = "Seconds"
default = "600"
description = "Total cap in seconds on one model request"
used-by = ["mate"]

[polling.MATE_POLL_INTERVAL_SECONDS]
go-type = "Seconds"
default = "900"
description = "Interval in seconds between study directory scans"
used-by = ["mate"]

[render.MATE_DPI]
go-type = "RenderDPI"
default = "250"
description = "Resolution used when rendering PDF pages, between 72 and 600 DPI"
used-by = ["mate"]

[logging.MATE_LOG_LEVEL]
go-type = "LogLevel"
default = "info"
description = "Log level: debug, info, warn, or error"
used-by = ["mate"]

[logging.MATE_LOG_COLOR]
go-type = "Bool"
default = "true"
description = "Enable colored log output"
used-by = ["mate"]

[notifications.MATE_NOTIFICATIONS]
go-type = "Bool"
default = "true"
description = "Send a macOS notification when a page needs review"
used-by = ["mate"]
